name: Validate frontend skill packs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate skill catalogs and references
        run: python scripts/validate_pack.py
      - name: Run focused unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

