name: Validate frontend skill packs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate skill frontmatter, structure, catalogs and references
        run: python scripts/validate_pack.py
      - name: Run focused unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint canonical skill, security source and authoring Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            skills/**/SKILL.md
            docs/skill-authoring.md
            knowledge/security/**/*.md
            README.md
            NOTICE.md
            CONTRIBUTING.md
